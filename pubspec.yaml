name: artic_muzik
description: ArticMuzik – минималистичный музыкальный плеер
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.38
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  audio_service: ^0.18.12
  rxdart: ^0.27.7
  palette_generator: ^0.3.3
  flutter_animate: ^4.1.1
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  http: ^1.2.2
  yandex_music: ^1.2.2
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  sqflite: ^2.3.3      # <-- новое
  path: ^1.9.0         # <-- новое

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/placeholder_cover.png
    - assets/images/app_icon.png
  fonts:
    - family: StieglitzSP
      fonts:
        - asset: assets/fonts/StieglitzSP-Bold.otf
    - family: GhastlyPanic
      fonts:
        - asset: assets/fonts/GhastlyPanicCyr.otf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"